events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream api_cluster {
        server api-1:8000 max_fails=3 fail_timeout=10s;
        server api-2:8000 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    # Extract or generate X-Request-ID
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # 搶票寫入端點保護性限流（依下游 DB 單列序號鎖寫入承載量校準，過載快速回 429 防雪崩超時）
    limit_req_zone $request_uri zone=booking_write_zone:10m rate=60r/s;
    limit_req_status 429;

    server {
        listen 80;
        client_max_body_size 25m;

        # Timeouts for streaming report export (500k rows)
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;

        # WebSocket support (extended timeout for Scenario B)
        location /ws/ {
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $req_id;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SSE streaming endpoints (unbuffered real-time progress push)
        location ~ /stream$ {
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Booking write endpoints with fast-fail load shedding (429)
        location ~ ^/api/v1/events/[0-9]+/tickets/(reserve|allocate)$ {
            limit_req zone=booking_write_zone burst=30 nodelay;
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
        }

        # API & Swagger docs routing
        location ~ ^/(api/|health|docs|redoc|openapi\.json) {
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
        }

        # Static frontend hosting (Booking Seat Map & Admin Live Dashboard)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
